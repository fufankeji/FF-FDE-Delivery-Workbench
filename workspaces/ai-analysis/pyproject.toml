[project]
name = "northlight-data-workspace"
version = "0.1.0"
description = "Local-first agentic data analysis workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16",
  "deepagents>=0.3",
  "duckdb>=1.3",
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "joblib>=1.5",
  "langchain-openai>=0.3",
  "langgraph-checkpoint-sqlite>=2.0",
  "markdown-it-py>=3.0",
  "openpyxl>=3.1",
  "orjson>=3.10",
  "pandas>=2.3",
  "polars>=1.31",
  "psutil>=7.0",
  "pyarrow>=20.0",
  "pydantic-settings>=2.10",
  "pymysql>=1.1",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "scikit-learn>=1.7",
  "sqlalchemy>=2.0",
  "sqlglot>=27.0",
  "sse-starlette>=2.4",
  "structlog>=25.4",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "mypy>=1.16",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/northlight"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["northlight"]
mypy_path = ["backend"]

[[tool.mypy.overrides]]
module = ["joblib.*", "pandas.*", "sklearn.*", "yaml.*"]
ignore_missing_imports = true
