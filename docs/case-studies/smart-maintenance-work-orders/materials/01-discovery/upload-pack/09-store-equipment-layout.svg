<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">HZ-021 卖场设备位置草图</title>
  <desc id="desc">仿真门店平面位置草图，显示旧空调标签和当前空调设备候选位置。</desc>
  <rect width="1200" height="800" fill="#f5f7fb"/>
  <rect x="56" y="48" width="1088" height="704" rx="28" fill="#ffffff" stroke="#23324a" stroke-width="4"/>
  <text x="92" y="105" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17223b">HZ-021 卖场设备位置草图（仿真）</text>
  <text x="92" y="145" font-family="Arial, sans-serif" font-size="20" fill="#667085">来源：店长手绘后由项目人员整理；位置仍需现场确认</text>
  <rect x="100" y="190" width="710" height="490" rx="18" fill="#eef4ff" stroke="#89a5d6" stroke-width="3"/>
  <text x="410" y="430" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#31568f">卖场</text>
  <rect x="845" y="190" width="245" height="220" rx="18" fill="#fff4e5" stroke="#d69b3a" stroke-width="3"/>
  <text x="902" y="300" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#8b5a12">后仓</text>
  <rect x="845" y="445" width="245" height="235" rx="18" fill="#edf9f0" stroke="#4b9f68" stroke-width="3"/>
  <text x="882" y="565" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#287443">弱电间</text>
  <circle cx="190" cy="260" r="42" fill="#d92d20"/>
  <text x="250" y="252" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7a271a">现场可见旧标签</text>
  <text x="250" y="286" font-family="Arial, sans-serif" font-size="22" fill="#7a271a">HVAC-HZ021-OLD</text>
  <circle cx="700" cy="610" r="42" fill="#175cd3"/>
  <text x="420" y="604" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1849a9">台账当前候选</text>
  <text x="420" y="638" font-family="Arial, sans-serif" font-size="22" fill="#1849a9">HVAC-HZ021-02</text>
  <path d="M232 260 C390 220, 560 240, 664 570" fill="none" stroke="#d92d20" stroke-width="5" stroke-dasharray="12 12"/>
  <text x="350" y="205" font-family="Arial, sans-serif" font-size="20" fill="#b42318">标签与台账位置可能冲突</text>
  <rect x="92" y="704" width="996" height="30" rx="12" fill="#fff1f0"/>
  <text x="112" y="726" font-family="Arial, sans-serif" font-size="18" fill="#912018">不能仅凭此图确认设备身份、合同状态或费用批准。</text>
</svg>
